<!-- Supabase → Authentication → Emails → Templates → "Confirm signup"
     Subject: Your Inventory System verification code -->
<div style="background:#faf7f0;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#0b1f3a">
  <div style="max-width:480px;margin:0 auto;background:#fffdf8;border:1px solid #e6dfd0;border-radius:12px;overflow:hidden">
    <div style="background:#0b1f3a;color:#faf7f0;padding:20px 24px;font-size:18px;font-weight:bold">Inventory System</div>
    <div style="padding:24px">
      <p style="margin:0 0 12px">Welcome!</p>
      <p style="margin:0 0 20px">Enter this code to verify your email and activate your account:</p>
      <div style="font-size:32px;letter-spacing:10px;font-weight:bold;text-align:center;background:#f1ece1;border-radius:8px;padding:16px 0">{{ .Token }}</div>
      <p style="margin:20px 0 0;font-size:13px;color:#5b6779">This code expires in 10 minutes. If you didn't create an account, you can ignore this email.</p>
    </div>
  </div>
</div>
